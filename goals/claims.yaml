# goals/claims.yaml — Insurance Claims domain: claim submission and the end-to-end cycle.
goals:
  submit_claim:
    aliases: ["submit claim", "claim submit"]
    flow: SubmitClaimFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null
      patientName:
        type: string
        default: null
      forceReason:
        type: string
        default: "Testbot automation: force submit past rule violations"

  claim_to_submitted:
    aliases: ["claim to submitted", "end to end", "end-to-end billing", "full flow"]
    flow: ClaimToSubmittedFlow
    implemented: true
    params:
      $group: resume   # mrn/ssn/startAt/skipStages from goals/_shared.yaml
      planId:
        type: string
        default: "68888"
      lastName:
        type: string
        default: null   # optional: pin the new patient's last name (default generated by step as Testbot_<timestamp>)
      encounterType:
        type: string
        default: "Inpatient Acute"
      admit:
        type: boolean
        default: true
      waitForBnr:
        type: boolean
        default: true
      cpts:
        type: string
        default: "96372,96374"
      qty:
        type: number
        default: 10
      admitDiagnosis:
        type: string
        default: "I69.941"
      principalDiagnosis:
        type: string
        default: "S94.10XD"
      drg:
        type: string
        default: "182"
      severityIllness:
        type: string
        default: "1 - Minor"
      riskMortality:
        type: string
        default: "1 - Minor"
      dischargeDisposition:
        type: string
        default: "Home or self-care"
      forceReason:
        type: string
        default: "Testbot automation: force bill/submit past edits"

  claim_to_errored:
    aliases: ["claim to errored", "claim edits needed", "errored claim"]
    flow: ClaimToErroredFlow
    implemented: true
    params:
      $group: resume   # mrn/ssn/startAt/skipStages from goals/_shared.yaml
      planId:
        type: string
        default: "68888"
      lastName:
        type: string
        default: null   # optional: pin the new patient's last name (default generated by step as Testbot_<timestamp>)
      encounterType:
        type: string
        default: "Inpatient Acute"
      admit:
        type: boolean
        default: true
      waitForBnr:
        type: boolean
        default: true
      cpts:
        type: string
        default: "96372,96374"
      qty:
        type: number
        default: 10
      admitDiagnosis:
        type: string
        default: "I69.941"
      principalDiagnosis:
        type: string
        default: "S94.10XD"
      drg:
        type: string
        default: "182"
      severityIllness:
        type: string
        default: "1 - Minor"
      riskMortality:
        type: string
        default: "1 - Minor"
      dischargeDisposition:
        type: string
        default: "Home or self-care"
      forceReason:
        type: string
        default: "Testbot automation: force bill past BNR edits"

  void_claim_rebill:
    aliases: ["void claim", "void and rebill"]
    flow: VoidClaimRebillFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null
      patientName:
        type: string
        default: null   # defaults to reusing the patient created in the same orchestration (scratch)
      forceReason:
        type: string
        default: "Testbot automation: force bill/submit past edits"

