# goals.yaml — goals and param schemas (declarative, no code).
# Rule: register confirmed goals only; implemented: false means registered but Flow not implemented.
# Param resolution priority: overrides (CLI/user) > preset > defaults.

goals:
  login:
    aliases: ["login", "log in", "sign in", "login to EHR"]
    flow: LoginFlow
    implemented: true
    params:
      username:
        type: string
        default: null   # null = resolve env EHR_USER at runtime (see steps/auth/login.step.ts)
        description: portal username; falls back to the environment default account
      password:
        type: string
        default: null   # null = resolve env EHR_PASS at runtime
        description: portal password; falls back to the environment default password

  create_patient:
    aliases: ["create patient", "new patient", "add patient"]
    flow: CreatePatientFlow
    implemented: true
    params:
      # all optional; null = step generates defaults (name Testbot_<timestamp>, SSN date+time, DOB random year)
      firstName: { type: string, default: null, description: "defaults to Auto" }
      lastName: { type: string, default: null, description: "defaults to Testbot_<YYMMDDHHmm>" }
      ssn: { type: string, default: null, description: "defaults to <digit sum of YY><MMDD><HHmm> grouped 3-2-4; e.g. 2026-09-16 17:44 -> 809-16-1744" }
      dob: { type: string, default: null, description: "MM/DD/YYYY; defaults to current month/day + random year 1980-2005" }
      address1: { type: string, default: null, description: "defaults to 123 Main St" }
      city: { type: string, default: null, description: "defaults to San Diego" }
      state: { type: string, default: null, description: "defaults to CA" }
      zip: { type: string, default: null, description: "defaults to 92101" }
      sex: { type: string, default: null, description: "defaults to random Female/Male" }
      citizenship: { type: string, default: null, description: "defaults to US Citizen" }
      searchMrn: { type: string, default: null, description: "search MRN that unlocks Create New Patient, defaults to 90001" }

  create_encounter:
    aliases: ["create encounter", "new encounter"]
    flow: CreateEncounterFlow
    implemented: true
    params:
      patientMode:
        type: string
        enum: ["new", "existing", "api"]
        default: "new"
      planId:
        type: string
        default: "68888"
        requiredIf:
          param: patientMode
          values: ["new", "api"]
      insurance:
        type: boolean
        default: true   # false = self-pay mode (no insurance registered, e.g. SZ35253 preconditions)
      encounterType:
        type: string
        enum: ["Inpatient Acute", "Outpatient", "Emergency", "Observation"]
        default: "Inpatient Acute"
      admit:
        type: boolean
        default: null
      waitForBnr:
        type: boolean
        default: null
      # encounter/admit data (verified on fbch34 during the phase-2 slice)
      facility:
        type: string
        default: null   # defaults to San Diego Medical Center - Cove Community Hospital
      expectedDatetime:
        type: string
        default: null   # MM/DD/YYYY hh:mm; defaults to browser clock +1 hour
      guarantorType:
        type: string
        default: null   # new patients only accept Entity
      guarantor:
        type: string
        default: null   # new patients only accept Mini Reg Guarantor
      admitType:
        type: string
        default: null   # defaults to Elective
      pointOfOrigin:
        type: string
        default: null   # defaults to Home or Self Care
      meansOfArrival:
        type: string
        default: null   # defaults to Self
      levelOfCare:
        type: string
        default: null   # defaults to Med-Surg
      bnrTimeoutMs:
        type: number
        default: 180000
      # create-patient passthrough (used to pin the name in new mode); in existing mode
      # ssn+lastName open an existing patient (Registration's primary search key = SSN)
      lastName:
        type: string
        default: null
        requiredIf:
          param: patientMode
          value: "existing"
      firstName:
        type: string
        default: null   # defaults to "Auto" in existing mode
      ssn:
        type: string
        default: null
        requiredIf:
          param: patientMode
          value: "existing"
      dob:
        type: string
        default: null
    presets:
      inpatient_acute_admit:
        patientMode: new
        planId: "68888"
        encounterType: Inpatient Acute
        admit: true
        waitForBnr: true
      inpatient_acute_existing_patient:
        patientMode: existing
        encounterType: Inpatient Acute
        admit: true
        waitForBnr: false
      outpatient:
        patientMode: new
        planId: "68888"
        encounterType: Outpatient
        admit: false
        waitForBnr: false

  quick_charge:
    aliases: ["quick charge", "submit charges", "post charges"]
    flow: QuickChargeFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null   # search and open the account directly by MRN (fastest/most precise); patientName can be omitted when mrn is given
      patientName:
        type: string
        default: null   # patient last name; may be omitted when orchestrated with create_encounter (uses scratch)
      cpts:
        type: string
        default: "96372,96374"   # comma-separated CPT/HCPCS codes
      qty:
        type: number
        default: 10

  start_billing:
    aliases: ["start billing", "bill"]
    flow: StartBillingFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null   # open the account directly by MRN (same as quick_charge)
      patientName:
        type: string
        default: null   # patient last name; one of mrn/patientName

  force_bill:
    aliases: ["force bill"]
    flow: ForceBillFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null
      patientName:
        type: string
        default: null
      forceReason:
        type: string
        default: "Testbot automation: force bill past BNR edits"

  submit_claim:
    aliases: ["submit claim", "claim submit"]
    flow: SubmitClaimFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null
      patientName:
        type: string
        default: null
      forceReason:
        type: string
        default: "Testbot automation: force submit past rule violations"

  claim_to_submitted:
    aliases: ["claim to submitted", "end to end", "end-to-end billing", "full flow"]
    flow: ClaimToSubmittedFlow
    implemented: true
    params:
      planId:
        type: string
        default: "68888"
      lastName:
        type: string
        default: null   # optional: pin the new patient's last name (default generated by step as Testbot_<timestamp>)
      encounterType:
        type: string
        default: "Inpatient Acute"
      admit:
        type: boolean
        default: true
      waitForBnr:
        type: boolean
        default: true
      cpts:
        type: string
        default: "96372,96374"
      qty:
        type: number
        default: 10
      admitDiagnosis:
        type: string
        default: "I69.941"
      principalDiagnosis:
        type: string
        default: "S94.10XD"
      drg:
        type: string
        default: "182"
      severityIllness:
        type: string
        default: "1 - Minor"
      riskMortality:
        type: string
        default: "1 - Minor"
      dischargeDisposition:
        type: string
        default: "Home or self-care"
      forceReason:
        type: string
        default: "Testbot automation: force bill/submit past edits"

  void_claim_rebill:
    aliases: ["void claim", "void and rebill"]
    flow: VoidClaimRebillFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null
      patientName:
        type: string
        default: null   # defaults to reusing the patient created in the same orchestration (scratch)
      forceReason:
        type: string
        default: "Testbot automation: force bill/submit past edits"

  transfer_to_insurance:
    aliases: ["transfer to insurance"]
    flow: TransferToInsuranceFlow
    implemented: true
    params:
      ssn:
        type: string
        default: null   # Registration's primary search key; defaults to scratch.patient (step errors if absent)
      lastName:
        type: string
        default: null   # defaults to scratch.patient
      planId:
        type: string
        default: "68888"
      transactionCode:
        type: string
        default: "0001"   # Transfer Patient to Insurance
      balanceType:
        type: string
        default: "Guarantor"   # SZ35253 manual recording: explicitly pick Guarantor for Balance Type
      amount:
        type: string
        default: null   # null = full amount (current Guarantor Balance)
      notes:
        type: string
        default: "Testbot automation: transfer to insurance"

  lookup_account:
    aliases: ["lookup patient", "find patient", "lookup account"]
    flow: LookupAccountFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null   # look up by MRN (fastest/most precise); one of mrn/patientName
      patientName:
        type: string
        default: null   # patient last name

  open_bnr_detail:
    aliases: ["open bnr", "open patient account"]
    flow: OpenBnrDetailFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null
      patientName:
        type: string
        default: null   # defaults to scratch.patient

  coding_complete:
    aliases: ["coding complete", "complete coding"]
    flow: CodingCompleteFlow
    implemented: true
    params:
      mrn:
        type: string
        default: null   # search and open the account directly by MRN (same as quick_charge); patientName can be omitted when mrn is given
      patientName:
        type: string
        default: null   # patient last name; may be omitted when orchestrated with create_encounter (uses scratch)
      admitDiagnosis:
        type: string
        default: "I69.941"
      principalDiagnosis:
        type: string
        default: "S94.10XD"
      drg:
        type: string
        default: "182"   # full code auto-selected (no candidate list, same as diagnosis codes); e.g. "182"
      severityIllness:
        type: string
        default: "1 - Minor"
      riskMortality:
        type: string
        default: "1 - Minor"
      dischargeDisposition:
        type: string
        default: "Home or self-care"

  discharge:
    aliases: ["discharge", "discharge patient"]
    flow: DischargeFlow
    implemented: true   # verified on fbch34 2026-09-16 (inside the SZ35253 chain + discharge goal)
    params:
      lastName:
        type: string
        default: null   # patient last name (required)
      ssn:
        type: string
        default: null   # patient SSN (Registration's primary search key, required)
      firstName:
        type: string
        default: null
      dischargeDisposition:
        type: string
        default: "Home or self-care"
      providerQuery:
        type: string
        default: null   # provider not pinned: open the list and take the first candidate by default; use only as a fallback when the list needs a search string
